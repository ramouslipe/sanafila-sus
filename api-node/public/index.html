<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANAFILA - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-slate-800 border-b-2 border-blue-500 pb-4 mb-6 flex justify-between items-end">
            <span>SANAFILA <span class="text-blue-600">SUS</span></span>
            <span class="text-sm font-normal text-slate-500">Matriz Dinâmica (Máx 100)</span>
        </h1>
        <div class="bg-white rounded-xl shadow-xl p-6">
            <div class="grid grid-cols-3 gap-4 mb-4 font-bold text-slate-500 uppercase text-xs tracking-wider border-b pb-3 px-4">
                <div>Paciente</div><div>Especialidade</div><div class="text-right">Score</div>
            </div>
            <div id="fila" class="space-y-3"></div>
        </div>
    </div>
    
    <!-- Script como módulo: Garante que a biblioteca de animação não quebre a página -->
    <script type="module">
        import autoAnimate from 'https://cdn.jsdelivr.net/npm/@formkit/auto-animate/+esm';
        
        const filaContainer = document.getElementById('fila');
        
        // Motor de animação suave e lento (1.2 segundos para dar impacto no pitch)
        autoAnimate(filaContainer, { duration: 1200, easing: 'ease-in-out' });

        let memorizarScores = {};

        async function carregarFila() {
            try {
                const res = await fetch('/api/fila');
                const fila = await res.json();
                
                fila.forEach((p, index) => {
                    let el = document.getElementById('paciente-' + p.id);
                    const isMarcos = p.nome === 'Marcos Vinicius';
                    
                    // 1. Cria a linha do paciente se não existir
                    if (!el) {
                        el = document.createElement('div');
                        el.id = 'paciente-' + p.id;
                        // Classes com transição de 2 segundos (esfriamento lento)
                        el.className = 'grid grid-cols-3 gap-4 p-4 rounded-lg border-l-4 border-slate-300 bg-white shadow-sm transition-colors duration-[2000ms] ease-out';
                        el.innerHTML = `
                            <div class="font-bold text-slate-700 truncate nome"></div>
                            <div class="text-slate-500 especialidade"></div>
                            <div class="text-right font-black text-slate-600 text-2xl score"></div>
                        `;
                        filaContainer.appendChild(el);
                    }
                    
                    const scoreAnterior = memorizarScores[p.id];
                    
                    // 2. Só altera texto e cores se a pontuação sofreu mudança
                    if (scoreAnterior !== p.score_dinamico) {
                        el.querySelector('.nome').textContent = (isMarcos ? '👨🏽‍💼 ' : '') + p.nome;
                        el.querySelector('.especialidade').textContent = p.especialidade;
                        el.querySelector('.score').textContent = p.score_dinamico;
                        
                        // GATILHO DA COR VERDE: Apenas se for o Marcos ganhando pontos
                        if (isMarcos && scoreAnterior !== undefined && p.score_dinamico > scoreAnterior) {
                            
                            // Acende verde instantaneamente
                            el.classList.remove('bg-white', 'border-slate-300');
                            el.classList.add('bg-green-100', 'border-green-500');
                            
                            // Remove o verde após 2.5 segundos (a classe 'transition-colors' cuidará do fade suave pro branco)
                            setTimeout(() => {
                                el.classList.remove('bg-green-100', 'border-green-500');
                                el.classList.add('bg-white', 'border-slate-300');
                            }, 2500);
                        }
                        
                        memorizarScores[p.id] = p.score_dinamico;
                    }
                    
                    // 3. REORDENAÇÃO FÍSICA NO DOM: É isso que aciona o deslizamento!
                    if (filaContainer.children[index] !== el) {
                        filaContainer.insertBefore(el, filaContainer.children[index]);
                    }
                });
            } catch(e) {
                console.error("Erro na API:", e);
            }
        }
        
        carregarFila();
        setInterval(carregarFila, 2000);
    </script>
</body>
</html>
